# Rheem/Noritz combi boiler display-link bus -> Home Assistant
# Olimex ESP32-POE (non-ISO). The 2-wire display bus goes through a 50k/10k divider to the ADC on GPIO35;
# an NPN on GPIO32 pulls the bus down to transmit; DS18B20 probes (not installed yet) on 1-Wire GPIO33.
#
# Dashboard version: the component is fetched from git. boiler.local.yaml uses ./components instead.
esphome:
  name: boiler
  friendly_name: Boiler

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

# LAN8720, RMII clock out on GPIO17, PHY power on GPIO12
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: GPIO17
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true

logger:
  level: INFO

api:
  id: api_server
  encryption:
    key: !secret boiler_api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret boiler_ota_password

web_server:
  port: 80
  version: 3

external_components:
  - source:
      type: git
      url: https://github.com/krconv/esphome-boiler
      ref: main   # the dashboard copy pins the full commit SHA
    components: [boiler_bus]


# ---- 1-Wire (DS18B20 probes, not installed yet) ---------------------------------------------------
# Every probe found is logged at boot ("Found devices:" in the one_wire log).
one_wire:
  - platform: gpio
    pin: GPIO33

# sensor:
#   - platform: dallas_temp
#     name: "Probe 1"
#     address: 0x1234567890abcdef   # from the boot log, or  index: 0

# ---- Boiler bus ---------------------------------------------------------------------------------
# Polls the boiler's registers itself while no display is on the bus (the "Display connected" sensor tells which).
# Poll tuning (optional): ping_delay 3050ms, fast_gap 46ms, min_interval 250ms.
boiler_bus:
  id: boiler_bus_hub
  adc_pin: GPIO35
  tx_pin: GPIO32
  # log_frames: true   # with logger level DEBUG: print every decoded frame

  # status register 0010
  flame:
    name: "Burner"
  pump:
    name: "Pump"
  ch_demand:
    name: "Heat demand"
  dhw_demand:
    name: "Hot water demand"
  spark:
    name: "Ignition"
  state:
    name: "Status"
  last_error:
    name: "Last error"
  error_history:
    name: "Error history"

  # temperatures
  supply_temperature:
    name: "Supply water temperature"
  return_temperature:
    name: "Return water temperature"
  cold_in_temperature:
    name: "Cold water inlet temperature"
  dhw_out_temperature:
    name: "Hot water outlet temperature"
  exhaust_temperature:
    name: "Exhaust temperature"
  dhw_setpoint:
    name: "Hot water setpoint"

  # combustion and water side
  fan_rpm:
    name: "Fan speed"
  flow:
    name: "Flow rate"
  water_pressure:
    name: "Water pressure"
  flame_sensor:
    name: "Flame signal"

  # gas estimate (rough: linear from fan RPM while the flame is on)
  gas_btu_h:
    name: "Gas input"
  propane_gal_h:
    name: "Propane rate"
  propane_total:
    name: "Propane used"

  # counters
  power_on_hours:
    name: "Power-on hours"
  ch_burner_hours:
    name: "Heating burner hours"
  dhw_burner_hours:
    name: "Hot water burner hours"
  pump_hours:
    name: "Pump hours"
  ch_ignitions:
    name: "Heating ignitions"

  # diagnostics
  display_connected:
    name: "Display connected"
  poll_result:
    name: "Last poll result"
  frames_per_second:
    name: "Bus frame rate"
  crc_errors:
    name: "Bus CRC errors"
  malformed_frames:
    name: "Bus malformed frames"
  last_frame_age:
    name: "Bus last frame age"

# Bus polling: off = listen only. Writes are only sent while polling is on and no display is connected.
switch:
  - platform: template
    name: "Bus polling"
    icon: mdi:swap-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(boiler_bus_hub).set_polling_enabled(true);
    turn_off_action:
      - lambda: id(boiler_bus_hub).set_polling_enabled(false);

# Heating (CH) setpoint, register 0101. The state is what the boiler reports, not the last command.
number:
  - platform: template
    name: "Heating setpoint"
    icon: mdi:thermometer-lines
    device_class: temperature
    unit_of_measurement: "°C"
    mode: box
    min_value: 30
    max_value: 60
    step: 0.5
    update_interval: 2s
    lambda: |-
      float v = id(boiler_bus_hub).ch_setpoint_c();
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: id(boiler_bus_hub).write_ch_setpoint(x);
