# Rheem/Noritz combi boiler display-link bus -> Home Assistant
# Olimex ESP32-POE (non-ISO). The 2-wire display bus goes through a 50k/10k divider to the ADC on GPIO35;
# an NPN on GPIO32 pulls the bus down to transmit; DS18B20 probes (not installed yet) on 1-Wire GPIO33.
#
# Local-checkout variant of boiler.yaml: the component comes from ./components.
# Build: esphome compile boiler.local.yaml (needs secrets.yaml with boiler_api_key, boiler_ota_password).
esphome:
  name: boiler
  friendly_name: Boiler

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

# LAN8720, RMII clock out on GPIO17, PHY power on GPIO12
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: GPIO17
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true

logger:
  level: INFO

api:
  id: api_server
  encryption:
    key: !secret boiler_api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret boiler_ota_password

web_server:
  port: 80
  version: 3

external_components:
  - source:
      type: local
      path: components


# ---- 1-Wire (DS18B20 probes, not installed yet) ---------------------------------------------------
# Every probe found is logged at boot ("Found devices:" in the one_wire log).
one_wire:
  - platform: gpio
    id: ow_bus
    pin: GPIO33

# Lists the probe addresses found on the bus (for naming them below)
text_sensor:
  - platform: template
    name: "1-Wire addresses"
    entity_category: diagnostic
    icon: mdi:identifier
    update_interval: 60s
    lambda: |-
      std::string s;
      for (auto a : id(ow_bus)->get_devices()) {
        char b[24];
        snprintf(b, sizeof(b), "%s0x%016llx", s.empty() ? "" : ",", (unsigned long long) a);
        s += b;
      }
      return s.empty() ? std::string("none") : s;

# sensor:
#   - platform: dallas_temp
#     name: "Probe 1"
#     address: 0x1234567890abcdef   # from the boot log, or  index: 0

# ---- Boiler bus ---------------------------------------------------------------------------------
# Polls the boiler's registers itself while no display is on the bus (the "Display connected" sensor tells which).
# Poll tuning (optional): ping_delay 3050ms, fast_gap 46ms, min_interval 250ms.
boiler_bus:
  id: boiler_bus_hub
  adc_pin: GPIO35
  tx_pin: GPIO32
  # log_frames: true   # with logger level DEBUG: print every decoded frame

  # status register 0010
  flame:
    name: "Burner"
  pump:
    name: "Pump"
  ch_demand:
    name: "Heat demand"
  dhw_demand:
    name: "Hot water demand"
  spark:
    name: "Ignition"
  state:
    name: "Status"
  last_error:
    name: "Last error"
  error_history:
    name: "Error history"
    entity_category: diagnostic
  register_changes:
    name: "Register Changes"
    entity_category: diagnostic
  registers_seen:
    name: "Registers Seen"
    entity_category: diagnostic
  vent_material:
    name: "Vent material"
  heating_type_preset:
    name: "Heating type preset"

  # temperatures
  supply_temperature:
    name: "Supply water temperature"
  return_temperature:
    name: "Return water temperature"
  cold_in_temperature:
    name: "Cold water inlet temperature"
  dhw_out_temperature:
    name: "Hot water outlet temperature"
  exhaust_temperature:
    name: "Exhaust temperature"

  # combustion and water side
  fan_rpm:
    name: "Fan speed"
  flow:
    name: "Flow rate"
  water_pressure:
    name: "Water pressure"
  flame_sensor:
    name: "Flame signal"

  # gas estimate (rough: linear from fan RPM while the flame is on)
  gas_btu_h:
    name: "Gas input"
  propane_gal_h:
    name: "Propane rate"
    id: propane_rate
    device_class: volume_flow_rate
  propane_total:
    name: "Propane used"
    id: propane_used

  # counters
  power_on_hours:
    name: "Power-on hours"
  ch_burner_hours:
    name: "Heating burner hours"
  dhw_burner_hours:
    name: "Hot water burner hours"
  pump_hours:
    name: "Pump hours"
  ch_ignitions:
    name: "Heating ignitions"

  # diagnostics
  display_connected:
    name: "Display connected"
  poll_result:
    name: "Last poll result"
  last_write:
    name: "Last write"
  frames_per_second:
    name: "Bus frame rate"
  crc_errors:
    name: "Bus CRC errors"
  malformed_frames:
    name: "Bus malformed frames"
  last_frame_age:
    name: "Bus last frame age"


# Home Assistant energy dashboard: gas must be in ft³/m³ (not liquid gallons).
# 1 US gal of liquid propane ≈ 36.39 ft³ of vapor at 60 °F.
time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: dallas_temp
    address: 0xa9000000db97d028
    name: "Basement supply temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0x79000000d8fafe28
    name: "Basement return temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0x7f000000dc2f7c28
    name: "First Floor supply temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0xf5000000db81af28
    name: "First Floor return temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0x46000000da8dd828
    name: "West Wing supply temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0x56000000dc3d2728
    name: "West Wing return temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0x66000000dc0c0d28
    name: "East Wing supply temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0xc4000000db7bd928
    name: "East Wing return temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0x30000000dc0deb28
    name: "Garage supply temperature"
    update_interval: 5s
  - platform: dallas_temp
    address: 0xda000000db070028
    name: "Garage return temperature"
    update_interval: 5s
  - platform: copy
    source_id: propane_used
    name: "Propane gas used"
    unit_of_measurement: "ft³"
    device_class: gas
    state_class: total_increasing
    icon: mdi:propane-tank
    accuracy_decimals: 2
    filters:
      - multiply: 36.39
  - platform: total_daily_energy
    name: "Propane Daily Usage"
    power_id: propane_rate
    unit_of_measurement: "gal"
    device_class: volume
    state_class: total_increasing
    icon: mdi:counter
    accuracy_decimals: 3

# Bus polling: off = listen only. Writes are only sent while polling is on and no display is connected.
switch:
  - platform: template
    name: "Bus polling"
    icon: mdi:swap-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(boiler_bus_hub).set_polling_enabled(true);
    turn_off_action:
      - lambda: id(boiler_bus_hub).set_polling_enabled(false);

  # Installer settings. The state is the boiler's read-back, not the last command. Writes (read-modify-write for
  # bit and byte fields) only go out while polling is on and no display is connected, like the setpoints below.

  - platform: template
    name: "Preheat enabled"
    id: sw_preheat_enabled
    restore_mode: DISABLED  # a restore would call the turn_on/off action at boot = a write to the boiler
    icon: mdi:calendar-clock
    entity_category: config
    turn_on_action:
      - lambda: |-
          auto *hub = id(boiler_bus_hub);
          if (!hub->write_field(0x0121, 0x0008, 1)) {  // refused: show the real state again
            float v = hub->read_field(0x0121, 0x0008);
            if (!std::isnan(v)) id(sw_preheat_enabled).publish_state(v > 0);
          }
    turn_off_action:
      - lambda: |-
          auto *hub = id(boiler_bus_hub);
          if (!hub->write_field(0x0121, 0x0008, 0)) {  // refused: show the real state again
            float v = hub->read_field(0x0121, 0x0008);
            if (!std::isnan(v)) id(sw_preheat_enabled).publish_state(v > 0);
          }

  # Hot water preheat running now (register 0009, high byte bit 0x02). The display sets it from its own schedule;
  # this switch lets Home Assistant run the schedule instead. The low byte of 0009 is left alone.
  - platform: template
    name: "Preheat"
    id: sw_preheat
    restore_mode: DISABLED  # a restore would call the turn_on/off action at boot = a write to the boiler
    icon: mdi:water-boiler-auto
    turn_on_action:
      - lambda: |-
          auto *hub = id(boiler_bus_hub);
          if (!hub->write_field(0x0009, 0x0200, 1)) {  // refused: show the real state again
            float v = hub->read_field(0x0009, 0x0200);
            if (!std::isnan(v)) id(sw_preheat).publish_state(v > 0);
          }
    turn_off_action:
      - lambda: |-
          auto *hub = id(boiler_bus_hub);
          if (!hub->write_field(0x0009, 0x0200, 0)) {  // refused: show the real state again
            float v = hub->read_field(0x0009, 0x0200);
            if (!std::isnan(v)) id(sw_preheat).publish_state(v > 0);
          }

# Heating (CH) setpoint, register 0101, and hot water (DHW) setpoint, register 0102. The state is what the boiler
# reports, not the last command. Writes only go out while polling is on and no display is connected.
number:
  - platform: template
    name: "Heating setpoint"
    id: num_ch_setpoint
    icon: mdi:thermometer-lines
    device_class: temperature
    unit_of_measurement: "°C"
    mode: box
    min_value: 30
    max_value: 60
    step: 0.5
    update_interval: 2s
    lambda: |-
      float v = id(boiler_bus_hub).ch_setpoint_c();
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_ch_setpoint(x)) id(num_ch_setpoint).update();  // refused: show the real value again

  - platform: template
    name: "Hot water setpoint"
    id: num_dhw_setpoint
    icon: mdi:water-thermometer
    device_class: temperature
    unit_of_measurement: "°C"
    mode: box
    min_value: 32
    max_value: 60
    step: 0.5
    update_interval: 2s
    lambda: |-
      float v = id(boiler_bus_hub).dhw_setpoint_c();
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_dhw_setpoint(x)) id(num_dhw_setpoint).update();  // refused: show the real value again

  # Installer settings (registers mapped 11-25, see register_map.md). 001A / 0012 are 1:HT Lo / Hi: stored as deg C
  # rounded to 0.5 and shown by the display in deg F. Minimum must stay below maximum.
  - platform: template
    name: "Heating minimum temperature"
    id: num_ch_min
    icon: mdi:thermometer-chevron-down
    entity_category: config
    device_class: temperature
    unit_of_measurement: "°C"
    mode: box
    min_value: 26.5
    max_value: 49
    step: 0.5
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_temp_c(0x001A);
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_min_temp(x)) id(num_ch_min).update();  // refused: show the real value again

  - platform: template
    name: "Heating maximum temperature"
    id: num_ch_max
    icon: mdi:thermometer-chevron-up
    entity_category: config
    device_class: temperature
    unit_of_measurement: "°C"
    mode: box
    min_value: 49.5
    max_value: 82
    step: 0.5
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_temp_c(0x0012);
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_max_temp(x)) id(num_ch_max).update();  // refused: show the real value again

  # Register 0122: high byte heating overrun, low byte hot water overrun (setting 13:Or, 0-60 min)
  - platform: template
    name: "Heating pump overrun"
    id: num_ch_pump_overrun
    icon: mdi:pump
    entity_category: config
    unit_of_measurement: "min"
    mode: box
    min_value: 0
    max_value: 60
    step: 1
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_field(0x0122, 0xFF00);
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_field(0x0122, 0xFF00, (uint16_t) x)) id(num_ch_pump_overrun).update();  // refused: show the real value again

  - platform: template
    name: "Hot water pump overrun"
    id: num_dhw_pump_overrun
    icon: mdi:pump
    entity_category: config
    unit_of_measurement: "min"
    mode: box
    min_value: 0
    max_value: 60
    step: 1
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_field(0x0122, 0x00FF);
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_field(0x0122, 0x00FF, (uint16_t) x)) id(num_dhw_pump_overrun).update();  // refused: show the real value again

  # Register 0108, setting 12:IV: re-ignite the burner once this many minutes have passed and the temperature dropped
  - platform: template
    name: "Re-ignite interval"
    id: num_reignite
    icon: mdi:timer-refresh-outline
    entity_category: config
    unit_of_measurement: "min"
    mode: box
    min_value: 0
    max_value: 20
    step: 1
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_field(0x0108, 0xFFFF);
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_field(0x0108, 0xFFFF, (uint16_t) x)) id(num_reignite).update();  // refused: show the real value again

  # Registers 0123 / 0109, setting 14:SW (CH burner swing): temperature *differences* in tenths of a deg C, shown in F delta.
  # No device_class: HA would convert it as an absolute temperature. Ranges are guesses (not confirmed against the display).
  - platform: template
    name: "Burner off differential"
    id: num_burner_off_diff
    icon: mdi:thermometer-chevron-up
    entity_category: config
    unit_of_measurement: "°F"
    mode: box
    min_value: 2
    max_value: 20
    step: 1
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_field(0x0123, 0xFFFF);
      if (std::isnan(v)) return {};
      return (float) boiler_bus::boiler::tenths_c_to_delta_f((uint16_t) v);
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_field(0x0123, 0xFFFF, boiler_bus::boiler::delta_f_to_tenths_c((int) x))) id(num_burner_off_diff).update();  // refused: show the real value again

  - platform: template
    name: "Burner on differential"
    id: num_burner_on_diff
    icon: mdi:thermometer-chevron-down
    entity_category: config
    unit_of_measurement: "°F"
    mode: box
    min_value: 5
    max_value: 40
    step: 1
    update_interval: 5s
    lambda: |-
      float v = id(boiler_bus_hub).read_field(0x0109, 0xFFFF);
      if (std::isnan(v)) return {};
      return (float) boiler_bus::boiler::tenths_c_to_delta_f((uint16_t) v);
    set_action:
      - lambda: |-
          if (!id(boiler_bus_hub).write_field(0x0109, 0xFFFF, boiler_bus::boiler::delta_f_to_tenths_c((int) x))) id(num_burner_on_diff).update();  // refused: show the real value again

button:
  # writes 0000 to 0142..0146 (the display's "clear history"); the error history sensor shows the read-back
  - platform: template
    name: "Clear error history"
    icon: mdi:delete-sweep-outline
    entity_category: config
    on_press:
      - lambda: id(boiler_bus_hub).clear_error_history();

# Home Assistant switches show the boiler's read-back: republished every 5 s from the register table.
interval:
  - interval: 5s
    then:
      - lambda: |-
          auto *hub = id(boiler_bus_hub);
          float v = hub->read_field(0x0121, 0x0008);
          if (!std::isnan(v)) id(sw_preheat_enabled).publish_state(v > 0);
          v = hub->read_field(0x0009, 0x0200);
          if (!std::isnan(v)) id(sw_preheat).publish_state(v > 0);
